<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Corporate Renewables Terminal</title>
  <meta http-equiv="refresh" content="0; url=https://princebavishi.github.io/ICRT-India-Corporate-Renewables-Terminal/">
  <script>
    (function() {
      var search = window.location.search || '';
      var hash = window.location.hash || '';
      // If served from local static server or file, route to frontend dist
      if (window.location.protocol === 'file:' || window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') {
        window.location.replace('./frontend/dist/index.html' + search + hash);
      } else {
        // Otherwise route to the production deployed URL
        window.location.replace('https://princebavishi.github.io/ICRT-India-Corporate-Renewables-Terminal/' + search + hash);
      }
    })();
  </script>
  <style>
    body {
      background-color: #0B1120;
      color: #94A3B8;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: #131D31;
      padding: 2.5rem;
      border-radius: 1rem;
      border: 1px solid rgba(255, 255, 255, 0.08);
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      max-width: 480px;
    }
    h2 { color: #F8FAFC; margin-bottom: 0.75rem; font-size: 1.25rem; }
    p { margin-bottom: 1.5rem; font-size: 0.95rem; line-height: 1.5; }
    a.btn {
      background: #10B981;
      color: #0B1120;
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-weight: 600;
      display: inline-block;
      transition: background 0.2s;
    }
    a.btn:hover { background: #34D399; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Redirecting to India Corporate Renewables Terminal...</h2>
    <p>Launching the modern React & Vite financial terminal (same as Vercel).</p>
    <a class="btn" href="https://princebavishi.github.io/ICRT-India-Corporate-Renewables-Terminal/">Open Terminal</a>
  </div>
</body>
</html>
